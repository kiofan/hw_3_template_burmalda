services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      GREETING: "${GREETING:-Hello}"
      STORAGE: "sqlite"
      PORT: "8000"
      DATA_FILE: "/data/counter.db"
    volumes:
      - counter-data:/data
    restart: unless-stopped

volumes:
  counter-data:

